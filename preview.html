<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamPro PAI CBT - Preview Visual Sesuai Gambar 1, 2, & 3</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            kemenag: {
              50: '#F0FDF8',
              100: '#E6F9F2',
              200: '#C7F1E2',
              600: '#0D7A5F', // Primary Green Gambar 2
              700: '#09634D',
              800: '#064E3B',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .bg-mint-grid {
      background-color: #ebf8f4;
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="bg-mint-grid text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Top Controller Bar untuk Menguji Seluruh Tampilan -->
  <div class="bg-slate-900 text-white px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 text-xs border-b border-slate-800">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="font-bold">ExamPro Visual Preview</span>
      <span class="text-[10px] bg-emerald-950 text-emerald-300 border border-emerald-700 px-2 py-0.5 rounded-full font-medium">Tema Gambar 2 (PAI Kemenag & UIN Jakarta)</span>
    </div>
    <div class="flex items-center gap-1.5 flex-wrap">
      <button onclick="setView('stage1')" id="btn-stage1" class="px-3 py-1.5 rounded-xl bg-kemenag-600 text-white font-semibold transition">1. Login (Gambar 1)</button>
      <button onclick="setView('stage2')" id="btn-stage2" class="px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 transition">2. Konfirmasi Peserta (Gambar 3)</button>
      <button onclick="setView('exam')" id="btn-exam" class="px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 transition">3. Lembar Ujian CBT</button>
      <button onclick="setView('admin')" id="btn-admin" class="px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 transition">4. Admin & Template Excel</button>
    </div>
  </div>

  <!-- Header Branding Resmi Menggunakan File Asli Logo_Kemenag.png & Logo_UIN.png -->
  <header class="w-full bg-white border-b border-kemenag-100 shadow-sm py-3 px-4 md:px-8">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 md:gap-4">
        <div class="flex items-center gap-2.5">
          <!-- Logo Kemenag RI dari file asli -->
          <img
            src="Logo_Kemenag.png"
            alt="Logo Kemenag RI"
            class="w-10 h-10 object-contain drop-shadow-sm shrink-0"
            onerror="this.style.display='none'"
          />
          <!-- Logo UIN Syarif Hidayatullah Jakarta dari file asli -->
          <img
            src="Logo_UIN.png"
            alt="Logo UIN Syarif Hidayatullah Jakarta"
            class="w-10 h-10 object-contain drop-shadow-sm shrink-0"
            onerror="this.style.display='none'"
          />
        </div>
        <div>
          <h1 class="font-extrabold text-slate-800 text-sm md:text-base leading-tight">Pelatihan Guru PAI</h1>
          <p class="text-[11px] md:text-xs text-slate-500 font-medium">Direktorat PAI Kemenag RI & FITK UIN Syarif Hidayatullah Jakarta</p>
        </div>
      </div>

      <!-- User Status Bar Sesuai Gambar 3 Kanan Atas -->
      <div id="header-user-status" class="flex items-center gap-2 bg-kemenag-50 border border-kemenag-200 px-3.5 py-1.5 rounded-2xl text-xs">
        <span class="font-bold text-kemenag-800">sds - PESERTA TKA</span>
        <div class="w-6 h-6 rounded-lg bg-kemenag-600 text-white flex items-center justify-center">
          <i data-lucide="graduation-cap" class="w-3.5 h-3.5"></i>
        </div>
      </div>
    </div>
  </header>

  <!-- Container Konten Dinamis -->
  <main id="main-content" class="flex-1 flex flex-col justify-center"></main>

  <script>
    let currentView = 'stage1';

    function setView(view) {
      currentView = view;
      ['stage1', 'stage2', 'exam', 'admin'].forEach(v => {
        const btn = document.getElementById('btn-' + v);
        if (v === view) {
          btn.className = 'px-3 py-1.5 rounded-xl bg-kemenag-600 text-white font-semibold transition';
        } else {
          btn.className = 'px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 transition';
        }
      });

      // Tampilkan status header hanya jika stage2 atau exam
      const headerUser = document.getElementById('header-user-status');
      if (headerUser) {
        headerUser.style.display = (view === 'stage1' ? 'none' : 'flex');
      }

      render();
    }

    function render() {
      const main = document.getElementById('main-content');

      // TAHAP 1: SESUAI GAMBAR 1
      if (currentView === 'stage1') {
        main.innerHTML = `
          <div class="flex items-center justify-center p-6 my-auto">
            <div class="w-full max-w-md bg-white border border-kemenag-100 rounded-3xl shadow-xl shadow-kemenag-900/5 p-8 md:p-10 space-y-6">
              <div class="space-y-1.5">
                <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Selamat Datang</h2>
                <p class="text-xs md:text-sm text-slate-500 leading-relaxed">
                  Silakan login dengan menggunakan username dan password yang anda miliki
                </p>
              </div>

              <div class="space-y-5">
                <div class="border-b-2 border-slate-200 focus-within:border-kemenag-600 pb-1 flex items-center gap-3">
                  <i data-lucide="user" class="w-5 h-5 text-slate-400"></i>
                  <input type="text" value="sds" class="w-full py-2 bg-transparent text-sm text-slate-800 focus:outline-none font-medium" placeholder="Username">
                </div>
                <div class="border-b-2 border-slate-200 focus-within:border-kemenag-600 pb-1 flex items-center gap-3">
                  <i data-lucide="lock" class="w-5 h-5 text-slate-400"></i>
                  <input type="password" value="********" class="w-full py-2 bg-transparent text-sm text-slate-800 focus:outline-none font-medium" placeholder="Password">
                  <i data-lucide="eye" class="w-4 h-4 text-slate-400"></i>
                </div>
                <button onclick="setView('stage2')" class="w-full py-3.5 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow-md shadow-blue-200 transition">
                  Login
                </button>
              </div>
            </div>
          </div>
        `;
      } 
      // TAHAP 2: SESUAI GAMBAR 3 (TATA LETAK KIRI TOKEN, KANAN KONFIRMASI DATA)
      else if (currentView === 'stage2') {
        main.innerHTML = `
          <div class="max-w-6xl mx-auto w-full p-6 md:p-8 grid grid-cols-1 md:grid-cols-12 gap-6 items-start my-auto">
            <!-- Kolom Kiri: Kartu Rilis Token Sesuai Gambar 3 Kiri -->
            <div class="md:col-span-5 space-y-4">
              <div class="p-5 md:p-6 bg-white rounded-3xl shadow-lg shadow-kemenag-900/5 border border-kemenag-100 flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <span class="text-sm font-semibold text-slate-700">Token :</span>
                  <span class="font-mono text-xl font-extrabold text-kemenag-800 tracking-wider">5LU3JH</span>
                </div>
                <button onclick="alert('Token telah diperbarui!')" class="px-4 py-1.5 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold shadow-sm transition">
                  Refresh
                </button>
              </div>

              <div class="p-5 bg-kemenag-50/70 border border-kemenag-200 rounded-3xl text-xs text-kemenag-900 space-y-2">
                <h4 class="font-bold text-kemenag-800 text-sm">Petunjuk Peserta:</h4>
                <p class="text-slate-600">Pastikan data konfirmasi di samping sesuai dengan identitas Anda sebelum memasukkan token ujian.</p>
              </div>
            </div>

            <!-- Kolom Kanan: Kartu Konfirmasi Data Peserta Sesuai Gambar 3 Kanan -->
            <div class="md:col-span-7">
              <div class="p-6 md:p-8 bg-white rounded-3xl shadow-xl shadow-kemenag-900/5 border border-kemenag-100 space-y-4">
                <h3 class="text-xl font-bold text-slate-800 tracking-tight pb-2 border-b border-slate-100">
                  Konfirmasi data Peserta
                </h3>

                <div class="border-b border-slate-100 pb-2">
                  <span class="block text-[11px] font-semibold text-slate-500 uppercase">Username</span>
                  <span class="text-sm font-semibold text-slate-800">sds</span>
                </div>

                <div class="border-b border-slate-100 pb-2">
                  <span class="block text-[11px] font-semibold text-slate-500 uppercase">Nama Peserta</span>
                  <span class="text-sm font-semibold text-slate-800">sds - PESERTA TKA</span>
                </div>

                <div class="border-b border-slate-100 pb-2">
                  <span class="block text-[11px] font-semibold text-slate-500 uppercase">Jenis Kelamin</span>
                  <span class="text-sm font-semibold text-slate-800">Laki-Laki</span>
                </div>

                <div class="border-b border-slate-100 pb-2">
                  <span class="block text-[11px] font-semibold text-slate-500 uppercase">Mata Ujian</span>
                  <span class="text-sm font-bold text-kemenag-700">Pretest Guru PAI (Paket 1)</span>
                </div>

                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Peserta</label>
                  <input type="text" value="Drs. H. Ahmad Fauzi, M.Pd" class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 text-sm font-medium text-slate-800">
                </div>

                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Tanggal Lahir</label>
                  <div class="grid grid-cols-3 gap-3">
                    <input type="text" value="15" placeholder="Hari" class="w-full px-3 py-2 rounded-2xl border border-slate-200 bg-slate-50 text-center text-sm font-medium">
                    <input type="text" value="08" placeholder="Bulan" class="w-full px-3 py-2 rounded-2xl border border-slate-200 bg-slate-50 text-center text-sm font-medium">
                    <input type="text" value="1985" placeholder="Tahun" class="w-full px-3 py-2 rounded-2xl border border-slate-200 bg-slate-50 text-center text-sm font-medium">
                  </div>
                </div>

                <div>
                  <label class="block text-xs font-bold text-blue-600 mb-1">Token</label>
                  <input type="text" value="5LU3JH" placeholder="Ketikkan token di sini" class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 text-sm font-mono font-bold tracking-wider uppercase text-slate-800">
                </div>

                <button onclick="setView('exam')" class="w-full py-3 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow-md shadow-blue-200 transition mt-2">
                  Submit
                </button>
              </div>
            </div>
          </div>
        `;
      }
      // TAHAP 3: LEMBAR UJIAN CBT DENGAN PALET WARNA HIJAU GAMBAR 2
      else if (currentView === 'exam') {
        main.innerHTML = `
          <div class="max-w-6xl mx-auto w-full p-6 space-y-6">
            <div class="bg-white/90 backdrop-blur border border-kemenag-200 rounded-2xl p-4 flex items-center justify-between shadow-sm">
              <span class="font-bold text-kemenag-800 text-sm uppercase">Pretest Pelatihan Guru PAI (Paket 1)</span>
              <span class="px-3.5 py-1.5 rounded-2xl border border-kemenag-200 font-mono font-bold text-xs text-kemenag-800 bg-kemenag-50">
                Waktu Tersisa: 28:45
              </span>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 items-start">
              <div class="lg:col-span-3 bg-white border border-kemenag-100 rounded-3xl p-6 md:p-8 space-y-6 shadow-sm">
                <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div class="flex items-center gap-3">
                    <span class="w-8 h-8 rounded-xl bg-kemenag-600 text-white font-bold text-xs flex items-center justify-center">1</span>
                    <span class="text-xs font-semibold px-2.5 py-1 rounded-xl bg-kemenag-50 text-kemenag-700 border border-kemenag-200">Pilihan Ganda Tunggal</span>
                  </div>
                  <span class="text-xs text-slate-400 font-medium">Bobot: 1 poin</span>
                </div>
                <p class="text-slate-800 text-base md:text-lg leading-relaxed">
                  Apa kepanjangan dari CBT dalam sistem asesmen pendidikan modern pada lingkungan madrasah/sekolah?
                </p>
                <div class="space-y-3">
                  <div class="flex items-center gap-3 p-3.5 rounded-2xl border border-kemenag-600 bg-kemenag-50/70 text-kemenag-950 font-semibold cursor-pointer">
                    <span class="w-6 h-6 rounded-full bg-kemenag-600 text-white text-xs flex items-center justify-center">A</span>
                    <span class="text-sm">Computer-Based Test</span>
                  </div>
                  <div class="flex items-center gap-3 p-3.5 rounded-2xl border border-slate-200 hover:bg-slate-50 text-slate-700 cursor-pointer">
                    <span class="w-6 h-6 rounded-full border border-slate-300 text-xs flex items-center justify-center">B</span>
                    <span class="text-sm">Core Basic Technology</span>
                  </div>
                </div>
                <div class="flex justify-between pt-2">
                  <button class="px-4 py-2 rounded-2xl bg-slate-100 text-slate-400 text-xs font-medium cursor-not-allowed">Sebelumnya</button>
                  <button class="px-6 py-2 rounded-2xl bg-kemenag-600 text-white text-xs font-bold shadow-sm shadow-kemenag-200">Selanjutnya &rarr;</button>
                </div>
              </div>

              <!-- Sidebar Nomor Soal -->
              <div class="lg:col-span-1 bg-white border border-kemenag-100 rounded-3xl p-5 space-y-4 shadow-sm">
                <h4 class="font-bold text-slate-800 text-xs pb-2 border-b">Navigasi Soal</h4>
                <div class="grid grid-cols-4 gap-2">
                  <span class="h-9 rounded-xl bg-kemenag-600 text-white text-xs font-bold flex items-center justify-center">1</span>
                  <span class="h-9 rounded-xl bg-slate-100 text-slate-700 text-xs font-medium flex items-center justify-center">2</span>
                  <span class="h-9 rounded-xl bg-slate-100 text-slate-700 text-xs font-medium flex items-center justify-center">3</span>
                  <span class="h-9 rounded-xl bg-slate-100 text-slate-700 text-xs font-medium flex items-center justify-center">4</span>
                </div>
                <button onclick="setView('stage1')" class="w-full py-2.5 rounded-2xl border border-rose-200 text-rose-600 hover:bg-rose-50 text-xs font-bold mt-4">Kumpulkan Lembar Ujian</button>
              </div>
            </div>
          </div>
        `;
      }
      // TAHAP 4: ADMIN PANEL DENGAN TEMPLATE EXCEL
      else if (currentView === 'admin') {
        main.innerHTML = `
          <div class="max-w-6xl mx-auto w-full p-6 md:p-8 space-y-6">
            <div class="bg-white border border-kemenag-100 rounded-3xl p-6 flex flex-wrap items-center justify-between gap-4 shadow-sm">
              <div>
                <h3 class="font-extrabold text-slate-800 text-lg">Bank Soal Guru PAI & Template Excel</h3>
                <p class="text-xs text-slate-500 font-medium">Buat soal manual atau unggah puluhan soal sekaligus dari file Excel (.csv)</p>
              </div>
              <div class="flex items-center gap-2.5">
                <button onclick="alert('Mengunduh Template_Bank_Soal_ExamPro_PAI.csv')" class="px-4 py-2 rounded-2xl bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-300 text-xs font-bold flex items-center gap-1.5 transition">
                  <i data-lucide="download" class="w-4 h-4"></i>
                  Download Template Excel
                </button>
                <button onclick="alert('Buka dialog pilih file Excel (.csv)')" class="px-4 py-2 rounded-2xl bg-kemenag-50 hover:bg-kemenag-100 text-kemenag-800 border border-kemenag-300 text-xs font-bold flex items-center gap-1.5 transition">
                  <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                  Import dari Excel / CSV
                </button>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="bg-white border border-kemenag-100 rounded-3xl p-5 shadow-sm space-y-2">
                <div class="flex items-center gap-2">
                  <span class="w-6 h-6 rounded-lg bg-kemenag-600 text-white font-bold text-xs flex items-center justify-center">1</span>
                  <span class="text-xs font-bold text-kemenag-700 bg-kemenag-50 px-2 py-0.5 rounded-lg uppercase">Pilihan Ganda</span>
                </div>
                <p class="text-xs text-slate-800 font-medium">Apa kepanjangan dari CBT dalam sistem asesmen pendidikan modern?</p>
                <div class="text-[11px] text-slate-500 font-mono">Kunci: <strong class="text-emerald-700">A</strong> | Bobot: 1</div>
              </div>
              <div class="bg-white border border-kemenag-100 rounded-3xl p-5 shadow-sm space-y-2">
                <div class="flex items-center gap-2">
                  <span class="w-6 h-6 rounded-lg bg-kemenag-600 text-white font-bold text-xs flex items-center justify-center">2</span>
                  <span class="text-xs font-bold text-purple-700 bg-purple-50 px-2 py-0.5 rounded-lg uppercase">Essay</span>
                </div>
                <p class="text-xs text-slate-800 font-medium">Jelaskan bagaimana pendekatan pembelajaran berbasis STREAM dan AI dapat diintegrasikan dalam materi PAI!</p>
                <div class="text-[11px] text-slate-500 font-mono">Bobot: 3 | Review Manual Pengajar</div>
              </div>
            </div>
          </div>
        `;
      }

      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    render();
  </script>
</body>
</html>
